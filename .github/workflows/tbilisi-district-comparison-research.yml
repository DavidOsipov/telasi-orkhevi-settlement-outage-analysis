name: Temporary Tbilisi district comparison research

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Query Telasi API for selected Tbilisi areas
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, time
          from collections import Counter
          from datetime import date, datetime
          from pathlib import Path

          ENDPOINT='https://app.telasi.ge/api/view/telasi/getPoweroutages'
          TERMS={
            'Orkhevi':'ორხევი',
            'Varketili':'ვარკეთილი',
            'Vazisubani':'ვაზისუბანი',
            'Temka':'თემქა',
            'Gldani':'გლდანი',
            'Didi Dighomi':'დიდი დიღომი',
            'Lilo':'ლილო',
            'Ponichala':'ფონიჭალა',
            'Isani':'ისანი',
          }
          HEADERS={
            'Content-Type':'application/json; charset=utf-8',
            'lang':'ka',
            'Origin':'https://www.telasi.ge',
            'Referer':'https://www.telasi.ge/',
            'User-Agent':'Mozilla/5.0',
          }

          def post(payload):
            raw=json.dumps(payload, ensure_ascii=False).encode('utf-8')
            req=urllib.request.Request(ENDPOINT,data=raw,headers=HEADERS,method='POST')
            with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read()
            doc=json.loads(data.decode('utf-8'))
            return doc.get('content') or {}

          def tax_ids(item):
            t=item.get('taxonomy') or {}
            if not isinstance(t,dict): return []
            vals=t.get('content_poweroutage') or []
            return [x for x in vals if isinstance(x,int)] if isinstance(vals,list) else []

          rows_by_label={}
          results={}
          for label,term in TERMS.items():
            unique={}; page=1; reported=None; totals=[]
            while True:
              payload={
                'contentType':'poweroutage',
                'searchText':term,
                'pageNumber':page,
                'perPage':100,
                'selectedlan':'ka',
                'taxonomy':{'content_poweroutage':[2769,2770]},
              }
              c=post(payload)
              items=[x for x in (c.get('list') or []) if isinstance(x,dict)]
              total=c.get('listCount')
              if isinstance(total,int): totals.append(total)
              if reported is None and isinstance(total,int): reported=total
              before=len(unique)
              for x in items:
                key=str(x.get('id')) if x.get('id') is not None else json.dumps(x,ensure_ascii=False,sort_keys=True)
                unique.setdefault(key,x)
              if reported is not None and len(unique)>=reported: break
              if not items or len(unique)==before: break
              page+=1
              if page>50: break
              time.sleep(0.15)
            rows=list(unique.values()); rows_by_label[label]=rows
            dates=[]; years=Counter(); unplanned_years=Counter(); planned=unplanned=other=0
            for x in rows:
              ids=set(tax_ids(x))
              if ids=={2770}: cls='unplanned'; unplanned+=1
              elif ids=={2769}: cls='planned'; planned+=1
              else: cls='other'; other+=1
              rawdate=x.get('date') or x.get('created_at') or ''
              if isinstance(rawdate,str) and len(rawdate)>=10 and rawdate[:4].isdigit():
                d=rawdate[:10]; dates.append(d); y=int(d[:4]); years[y]+=1
                if cls=='unplanned': unplanned_years[y]+=1
            results[label]={
              'query':term,'reported_total':reported,'returned_unique':len(rows),
              'complete_against_reported_total': reported is not None and len(rows)==reported and len(set(totals))<=1,
              'pages_fetched':page,'planned':planned,'unplanned':unplanned,'other':other,
              'first_publication_date':min(dates) if dates else None,'last_publication_date':max(dates) if dates else None,
              'publications_by_year':dict(sorted(years.items())),'unplanned_by_year':dict(sorted(unplanned_years.items())),
            }

          # Compare all areas inside the exact publication-date span of the Orkhevi search set.
          common_start=date.fromisoformat(results['Orkhevi']['first_publication_date'])
          common_end=date.fromisoformat(results['Orkhevi']['last_publication_date'])
          span_days=(common_end-common_start).days+1
          for label,rows in rows_by_label.items():
            unplanned_dates=[]; planned_dates=[]
            for x in rows:
              rawdate=x.get('date') or x.get('created_at') or ''
              if not (isinstance(rawdate,str) and len(rawdate)>=10): continue
              try: d=date.fromisoformat(rawdate[:10])
              except ValueError: continue
              if not (common_start<=d<=common_end): continue
              ids=set(tax_ids(x))
              if ids=={2770}: unplanned_dates.append(d)
              elif ids=={2769}: planned_dates.append(d)
            u=sorted(set(unplanned_dates)); p=sorted(set(planned_dates))
            results[label]['common_window_start']=str(common_start)
            results[label]['common_window_end']=str(common_end)
            results[label]['common_window_days']=span_days
            results[label]['unplanned_publications_in_common_window']=len(unplanned_dates)
            results[label]['unplanned_publication_days_in_common_window']=len(u)
            results[label]['planned_publication_days_in_common_window']=len(p)
            results[label]['calendar_days_per_unplanned_publication_day']=round(span_days/len(u),2) if u else None

          out={'captured_at':datetime.now().astimezone().isoformat(timespec='seconds'),'results':results}
          Path('district-comparison.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f"COMMON WINDOW {common_start}..{common_end} = {span_days} days")
          print('=== COMPACT TABLE ===')
          for label,r in results.items():
            print(f"{label:14} hits={r['reported_total']:>3} unplanned={r['unplanned']:>3} planned={r['planned']:>3} | common unplanned pubs={r['unplanned_publications_in_common_window']:>3} days={r['unplanned_publication_days_in_common_window']:>3} => one publication-day/{r['calendar_days_per_unplanned_publication_day']} calendar days")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: tbilisi-district-comparison
          path: district-comparison.json
          if-no-files-found: error
