name: Temporary World Bank Tbilisi benchmark probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Capture Enterprise Surveys API calls from Georgia page
        shell: bash
        run: |
          set -euo pipefail
          echo '=== browser binaries ==='
          which google-chrome || true
          which chromium || true
          which chromedriver || true
          python3 -m pip install --quiet selenium
          python3 - <<'PY'
          import json, time, re, pathlib
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1600,1200')
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          driver=webdriver.Chrome(options=opts)
          urls=[
            'https://www.enterprisesurveys.org/en/data/exploreeconomies/2023/georgia',
            'https://www.enterprisesurveys.org/en/data/exploreeconomies/2023/georgia#infrastructure-and-climate',
          ]
          allreq=[]
          try:
            for page in urls:
              print('NAV',page)
              driver.get(page)
              time.sleep(10)
              print('TITLE',driver.title)
              for entry in driver.get_log('performance'):
                try: msg=json.loads(entry['message'])['message']
                except Exception: continue
                if msg.get('method')!='Network.requestWillBeSent': continue
                req=msg.get('params',{}).get('request',{})
                u=req.get('url','')
                if 'extdataportal.worldbank.org' in u or '/api/esapi/' in u:
                  rec={'method':req.get('method'),'url':u,'postData':req.get('postData')}
                  if rec not in allreq: allreq.append(rec)
              # Also print browser console errors that could explain missing calls.
              for e in driver.get_log('browser'):
                if e.get('level') in ('SEVERE','WARNING'): print('BROWSER',e)
          finally:
            driver.quit()
          print('=== ES API REQUESTS ===')
          for r in allreq: print(json.dumps(r,ensure_ascii=False))
          pathlib.Path('worldbank-network-requests.json').write_text(json.dumps(allreq,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: worldbank-tbilisi-probe
          path: worldbank-network-requests.json
          if-no-files-found: error
