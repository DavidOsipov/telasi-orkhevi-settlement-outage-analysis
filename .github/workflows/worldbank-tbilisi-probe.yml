name: Temporary World Bank Tbilisi benchmark probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Extract Enterprise Surveys data API and Georgia metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, requests, pathlib

          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          jsurl='https://www.enterprisesurveys.org/etc.clientlibs/datasites-spa/clientlibs/clientlib-enterprisesurveys-data.js'
          js=s.get(jsurl,timeout=60).text
          out=[f'JS {jsurl} bytes={len(js.encode())}']

          # Extract all literal ES API URLs and API path-looking strings.
          urls=sorted(set(re.findall(r'https://extdataportal\.worldbank\.org/api/esapi[^"\'`\\\s]*',js)))
          out.append('=== LITERAL ESAPI URLS ===')
          out.extend(urls)

          # Print context around API-function names and important domain terms.
          terms=['GetAllEconomiesSubGroups','GetAllTopics','GetAllSubTopics','GetTopic','Indicator','SubNational','Subnational','subNational','subnational','Location','location','TopicIndicator','EconomyIndicator']
          out.append('=== CONTEXT ===')
          seen=set()
          for term in terms:
              for m in list(re.finditer(term,js,re.I))[:80]:
                  a=max(0,m.start()-500); b=min(len(js),m.end()+900)
                  sn=js[a:b].replace('\n',' ')
                  key=sn[:200]
                  if key in seen: continue
                  seen.add(key); out.append(f'[{term}] {sn}')

          # Official metadata endpoint: inspect Georgia and subgroups.
          meta_urls=[
            'https://extdataportal.worldbank.org/api/esapi/GetAllEconomiesSubGroups?lang=en',
            'https://extdataportal.worldbank.org/api/esapi/sn/GetAllEconomiesSubGroups?lang=en',
            'https://extdataportal.worldbank.org/api/esapi/GetAllTopics',
            'https://extdataportal.worldbank.org/api/esapi/sn/GetAllTopics?lang=en',
          ]
          out.append('=== METADATA RESPONSES ===')
          for u in meta_urls:
              r=s.get(u,timeout=30)
              out.append(f'GET {u} status={r.status_code} type={r.headers.get("content-type")} bytes={len(r.content)}')
              try:
                  data=r.json()
              except Exception:
                  out.append(r.text[:2000]); continue
              # Keep only entries that help identify Georgia/Tbilisi/electricity endpoints.
              if isinstance(data,list):
                  relevant=[]
                  for x in data:
                      txt=json.dumps(x,ensure_ascii=False).lower()
                      if any(k in txt for k in ['georgia','tbilisi','infrastructure','electric']): relevant.append(x)
                  out.append('RELEVANT '+json.dumps(relevant,ensure_ascii=False)[:30000])
                  out.append('FIRST '+json.dumps(data[:3],ensure_ascii=False)[:10000])
              else:
                  out.append(json.dumps(data,ensure_ascii=False)[:30000])

          pathlib.Path('worldbank-api-probe.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out[-500:]))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: worldbank-tbilisi-probe
          path: worldbank-api-probe.txt
          if-no-files-found: error
