name: Temporary World Bank Tbilisi benchmark probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Preserve full official Enterprise Surveys SPA bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests, pathlib, hashlib
          u='https://www.enterprisesurveys.org/etc.clientlibs/datasites-spa/clientlibs/clientlib-enterprisesurveys-data.js'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=60); r.raise_for_status()
          pathlib.Path('clientlib-enterprisesurveys-data.js').write_bytes(r.content)
          print('URL',u)
          print('BYTES',len(r.content))
          print('SHA256',hashlib.sha256(r.content).hexdigest())
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: worldbank-tbilisi-probe
          path: clientlib-enterprisesurveys-data.js
          if-no-files-found: error
