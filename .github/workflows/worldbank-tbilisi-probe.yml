name: Temporary World Bank Tbilisi benchmark probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Inspect raw Georgia topic-8 indicator response including subCuts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, requests, pathlib
          u='https://extdataportal.worldbank.org/api/esapi/GetEconomyIndicatorData/economyid/74/topicid/8/year/2023?lang=en'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=60); r.raise_for_status()
          data=r.json()
          pathlib.Path('topic8-raw.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          wanted={'in16','bready_in2','bready_in3_median','Number_electrical_outages','Duration_elec_outage','Perc_firms_experiencing_electricity_outages'}
          print('TOP TYPE',type(data).__name__,'LEN',len(data) if isinstance(data,list) else None)
          for i,x in enumerate(data if isinstance(data,list) else [data]):
            if not isinstance(x,dict): continue
            code=x.get('queryFieldName') or x.get('code') or x.get('indicatorCode')
            label=x.get('indicator') or x.get('publishedName') or x.get('name')
            txt=(str(code)+' '+str(label)).lower()
            if any(k in txt for k in ('electrical outage','electricity outage','bready_in2','bready_in3','perc_firms_experiencing','number_electrical','duration_elec')):
              print('\nENTRY',i,'code',code,'label',label)
              print(json.dumps(x,ensure_ascii=False,indent=2)[:200000])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: worldbank-tbilisi-probe
          path: topic8-raw.json
          if-no-files-found: error
