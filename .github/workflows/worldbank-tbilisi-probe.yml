name: Temporary World Bank Tbilisi benchmark probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Fetch official WBES 2023 Tbilisi electricity subgroup values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, requests, pathlib, hashlib
          u='https://extdataportal.worldbank.org/api/esapi/GetEconomyCutsData/economyid/74/year/2023/topicid/8/cutsid/3/?lang=en'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=60); r.raise_for_status()
          raw=r.content; data=r.json()
          pathlib.Path('tbilisi-topic8-location-cuts.json').write_bytes(raw)
          print('URL',u)
          print('BYTES',len(raw),'SHA256',hashlib.sha256(raw).hexdigest())
          print('TYPE',type(data).__name__,'LEN',len(data) if isinstance(data,list) else None)
          rows=data if isinstance(data,list) else [data]
          for i,row in enumerate(rows):
            if not isinstance(row,dict): continue
            txt=json.dumps(row,ensure_ascii=False).lower()
            if 'tbilisi' in txt or '1061' in txt:
              print('\nTBILISI ROW',i)
              print(json.dumps(row,ensure_ascii=False,indent=2)[:250000])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: worldbank-tbilisi-probe
          path: tbilisi-topic8-location-cuts.json
          if-no-files-found: error
