name: Telasi API probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_telasi_api.py"
      - "data/telasi_api/**"
      - ".github/workflows/telasi-api-probe.yml"

permissions:
  contents: read

jobs:
  fetch-orkhevi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Telasi Orkhevi API records
        run: |
          python scripts/fetch_telasi_api.py \
            --search-text "ორხევ" \
            --output-dir artifacts/telasi_api

      - name: Show normalized records
        run: |
          cat artifacts/telasi_api/fetch_metadata.json
          cat artifacts/telasi_api/records.csv

      - name: Probe exact list and detail payloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from urllib.request import Request, urlopen

          out = Path("artifacts/telasi_api")
          out.mkdir(parents=True, exist_ok=True)

          def post(url, payload):
              body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              req = Request(url, data=body, method="POST", headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json; charset=utf-8",
                  "User-Agent": "telasi-orkhevi-settlement-outage-analysis/1.0",
              })
              with urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return response.status, json.loads(raw.decode("utf-8")), raw

          list_url = "https://app.telasi.ge/api/view/telasi/getPoweroutages"
          payloads = {
              "user_exact": {
                  "searchText": "",
                  "pageNumber": 1,
                  "perPage": 12,
                  "selectedlan": "ka",
                  "taxonomy": {"content_poweroutage": [2769, 2770]},
              },
              "taxonomy_plus_search": {
                  "searchText": "ორხევ",
                  "pageNumber": 1,
                  "perPage": 100,
                  "selectedlan": "ka",
                  "taxonomy": {"content_poweroutage": [2769, 2770]},
              },
              "taxonomy_plus_content_type": {
                  "contentType": "poweroutage",
                  "searchText": "ორხევ",
                  "pageNumber": 1,
                  "perPage": 100,
                  "selectedlan": "ka",
                  "taxonomy": {"content_poweroutage": [2769, 2770]},
              },
          }
          for name, payload in payloads.items():
              status, data, raw = post(list_url, payload)
              (out / f"list-{name}.json").write_bytes(raw)
              api = data.get("api", {}) if isinstance(data, dict) else {}
              items = api.get("list", []) if isinstance(api, dict) else []
              print("LIST_PROBE", name, "status=", status, "listCount=", api.get("listCount"), "items=", len(items) if isinstance(items, list) else None)
              if isinstance(items, list):
                  for i, item in enumerate(items[:10], 1):
                      if isinstance(item, dict):
                          print("ITEM", name, i, json.dumps({k: item.get(k) for k in ["id","code","full_title","title","teaser","editor","outage_time","poweron_time","users_count","created_at","updated_at","slug","url"]}, ensure_ascii=False))

          detail_url = "https://www.telasi.ge/api/getMtData"
          detail_payload = {"url": "/company-news/power-outage?content=5584", "lang": "ka"}
          dstatus, ddata, draw = post(detail_url, detail_payload)
          (out / "detail-content-5584.json").write_bytes(draw)
          print("DETAIL_STATUS", dstatus)
          print("DETAIL_TOP_KEYS", list(ddata.keys()) if isinstance(ddata, dict) else type(ddata).__name__)
          print("DETAIL_PREVIEW", json.dumps(ddata, ensure_ascii=False)[:12000])
          PY

      - name: Crawl lazy-loaded frontend chunks for outage API code
        run: |
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          import re
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          page_url = "https://www.telasi.ge/company-news/power-outage"
          headers = {"User-Agent": "Mozilla/5.0"}
          html = urlopen(Request(page_url, headers=headers), timeout=30).read().decode("utf-8", "replace")
          seeds = [urljoin(page_url, src) for src in re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)', html, re.I)]
          queue = deque(seeds)
          seen = set()
          hits = []
          fetched = 0
          needles = [
              "getPoweroutages", "content_poweroutage", "poweroutage_address",
              "power-outage", "getMtData", "/api/view/telasi/", "outage_time", "poweron_time",
          ]

          while queue and fetched < 300:
              url = queue.popleft()
              if url in seen or urlparse(url).netloc != "www.telasi.ge":
                  continue
              seen.add(url)
              try:
                  raw = urlopen(Request(url, headers=headers), timeout=30).read()
                  text = raw.decode("utf-8", "replace")
              except Exception as exc:
                  continue
              fetched += 1
              for needle in needles:
                  for m in list(re.finditer(re.escape(needle), text, re.I))[:20]:
                      pos = m.start()
                      hits.append((url, needle, pos, text[max(0,pos-2500):min(len(text),pos+5500)]))
              for rel in re.findall(r'["\\\'](\./[^"\\\']+\.js)["\\\']', text):
                  child = urljoin(url, rel)
                  if child not in seen:
                      queue.append(child)

          lines = [f"fetched_js={fetched}", f"unique_urls={len(seen)}", f"hits={len(hits)}"]
          for url, needle, pos, context in hits:
              lines.append(f"\n### {url}\n--- {needle!r} @ {pos} ---\n{context}\n")
          out = Path("artifacts/telasi_api/frontend-outage-api.txt")
          out.write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines[:250]))
          PY

      - name: Upload API response artifact
        uses: actions/upload-artifact@v4
        with:
          name: telasi-orkhevi-api-response
          path: artifacts/telasi_api/
          if-no-files-found: error
