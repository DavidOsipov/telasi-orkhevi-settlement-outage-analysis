name: Telasi API probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_telasi_api.py"
      - "scripts/compare_telasi_api_sms.py"
      - "data/telasi_api/**"
      - "reports/telasi-api-findings-2026-08-08.md"
      - ".github/workflows/telasi-api-probe.yml"

permissions:
  contents: read

jobs:
  fetch-orkhevi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Orkhevi search results
        run: |
          python scripts/fetch_telasi_api.py \
            --search-text "ორხევ" \
            --per-page 100 \
            --output-dir artifacts/telasi_api/orkhevi

      - name: Fetch complete available publication corpus
        run: |
          python scripts/fetch_telasi_api.py \
            --search-text "" \
            --per-page 2000 \
            --output-dir artifacts/telasi_api/all

      - name: Compare public corpus with supplied SMS ETAs
        run: |
          python scripts/compare_telasi_api_sms.py \
            --api-dir artifacts/telasi_api/all \
            --orkhevi-dir artifacts/telasi_api/orkhevi \
            --output artifacts/telasi_api/comparison.json

      - name: Assert observed API invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/telasi_api")
          all_meta = json.loads((root/"all"/"fetch_metadata.json").read_text(encoding="utf-8"))
          ork_meta = json.loads((root/"orkhevi"/"fetch_metadata.json").read_text(encoding="utf-8"))
          comp = json.loads((root/"comparison.json").read_text(encoding="utf-8"))

          assert all_meta["content_listCount"] == all_meta["normalized_row_count"]
          assert all_meta["content_listCount"] >= 889
          assert ork_meta["content_listCount"] == 17
          assert comp["sms_eta_values_with_exact_public_api_match"] == 0
          assert comp["orkhevi_search_publication_count"] == 17
          print("Telasi API invariants OK")
          PY

      - name: Upload API corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: telasi-api-corpus
          path: artifacts/telasi_api/
          if-no-files-found: error
