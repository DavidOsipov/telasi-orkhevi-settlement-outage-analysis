name: Telasi API probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_telasi_api.py"
      - "data/telasi_api/**"
      - ".github/workflows/telasi-api-probe.yml"

permissions:
  contents: read

jobs:
  fetch-orkhevi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe browser-equivalent Telasi requests
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from urllib.request import Request, urlopen

          out = Path("artifacts/telasi_api")
          out.mkdir(parents=True, exist_ok=True)

          def post(url, payload, *, app_api=False):
              body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              headers = {
                  "Accept": "application/json, text/plain, */*" if app_api else "application/json",
                  "Content-Type": "application/json",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
                  "User-Agent": "Mozilla/5.0",
                  "Referer": "https://www.telasi.ge/",
              }
              if app_api:
                  headers["lang"] = "ka"
              req = Request(url, data=body, method="POST", headers=headers)
              with urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return response.status, json.loads(raw.decode("utf-8")), raw

          list_url = "https://app.telasi.ge/api/view/telasi/getPoweroutages"
          payloads = {
              "search_stem": {"contentType":"poweroutage","searchText":"ორხევ"},
              "search_name": {"contentType":"poweroutage","searchText":"ორხევი"},
              "search_genitive": {"contentType":"poweroutage","searchText":"ორხევის"},
              "user_exact": {"searchText":"","pageNumber":1,"perPage":12,"selectedlan":"ka","taxonomy":{"content_poweroutage":[2769,2770]}},
              "taxonomy_search": {"searchText":"ორხევ","pageNumber":1,"perPage":100,"selectedlan":"ka","taxonomy":{"content_poweroutage":[2769,2770]}},
          }

          summary = {}
          for name, payload in payloads.items():
              status, data, raw = post(list_url, payload, app_api=True)
              (out / f"list-{name}.json").write_bytes(raw)
              api = data.get("api", {}) if isinstance(data, dict) else {}
              items = api.get("list", []) if isinstance(api, dict) else []
              summary[name] = {
                  "status": status,
                  "listCount": api.get("listCount"),
                  "items": len(items) if isinstance(items, list) else None,
              }
              print("PROBE", name, json.dumps(summary[name], ensure_ascii=False))
              if isinstance(items, list):
                  for i, item in enumerate(items[:20], 1):
                      if isinstance(item, dict):
                          print("ITEM", name, i, json.dumps(item, ensure_ascii=False)[:8000])

          dstatus, ddata, draw = post(
              "https://www.telasi.ge/api/getMtData",
              {"url":"/company-news/power-outage?content=5584","lang":"ka"},
          )
          (out / "detail-content-5584.json").write_bytes(draw)
          summary["getMtData_5584"] = {
              "status": dstatus,
              "top_keys": list(ddata.keys()) if isinstance(ddata,dict) else None,
              "response_bytes": len(draw),
          }
          (out / "probe-summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: telasi-api-browser-equivalent
          path: artifacts/telasi_api/
          if-no-files-found: error
