name: Telasi API probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_telasi_api.py"
      - "data/telasi_api/**"
      - ".github/workflows/telasi-api-probe.yml"

permissions:
  contents: read

jobs:
  fetch-orkhevi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe exact list and detail payloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from urllib.request import Request, urlopen

          out = Path("artifacts/telasi_api")
          out.mkdir(parents=True, exist_ok=True)

          def post(url, payload):
              body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              req = Request(url, data=body, method="POST", headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json; charset=utf-8",
                  "User-Agent": "telasi-orkhevi-settlement-outage-analysis/1.0",
              })
              with urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return response.status, json.loads(raw.decode("utf-8")), raw

          list_url = "https://app.telasi.ge/api/view/telasi/getPoweroutages"
          payloads = {
              "user_exact": {
                  "searchText": "",
                  "pageNumber": 1,
                  "perPage": 12,
                  "selectedlan": "ka",
                  "taxonomy": {"content_poweroutage": [2769, 2770]},
              },
              "taxonomy_search": {
                  "searchText": "ორხევ",
                  "pageNumber": 1,
                  "perPage": 100,
                  "selectedlan": "ka",
                  "taxonomy": {"content_poweroutage": [2769, 2770]},
              },
              "contenttype_taxonomy_search": {
                  "contentType": "poweroutage",
                  "searchText": "ორხევ",
                  "pageNumber": 1,
                  "perPage": 100,
                  "selectedlan": "ka",
                  "taxonomy": {"content_poweroutage": [2769, 2770]},
              },
              "contenttype_all": {
                  "contentType": "poweroutage",
                  "searchText": "",
                  "pageNumber": 1,
                  "perPage": 100,
                  "selectedlan": "ka",
                  "taxonomy": {"content_poweroutage": [2769, 2770]},
              },
          }
          summary = {}
          for name, payload in payloads.items():
              status, data, raw = post(list_url, payload)
              (out / f"list-{name}.json").write_bytes(raw)
              api = data.get("api", {}) if isinstance(data, dict) else {}
              items = api.get("list", []) if isinstance(api, dict) else []
              summary[name] = {
                  "status": status,
                  "top_keys": list(data.keys()) if isinstance(data, dict) else None,
                  "listCount": api.get("listCount"),
                  "items": len(items) if isinstance(items, list) else None,
              }
              print("PROBE", name, json.dumps(summary[name], ensure_ascii=False))
              if isinstance(items, list):
                  for i, item in enumerate(items[:20], 1):
                      if isinstance(item, dict):
                          print("ITEM", name, i, json.dumps(item, ensure_ascii=False)[:5000])

          detail_url = "https://www.telasi.ge/api/getMtData"
          detail_payload = {"url": "/company-news/power-outage?content=5584", "lang": "ka"}
          dstatus, ddata, draw = post(detail_url, detail_payload)
          (out / "detail-content-5584.json").write_bytes(draw)
          summary["getMtData_5584"] = {
              "status": dstatus,
              "top_keys": list(ddata.keys()) if isinstance(ddata, dict) else None,
              "response_chars": len(draw),
          }
          print("DETAIL", json.dumps(summary["getMtData_5584"], ensure_ascii=False))
          print("DETAIL_BODY", json.dumps(ddata, ensure_ascii=False)[:15000])

          (out / "probe-summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: telasi-api-focused-probe
          path: artifacts/telasi_api/
          if-no-files-found: error
