name: Telasi API probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_telasi_api.py"
      - "data/telasi_api/**"
      - ".github/workflows/telasi-api-probe.yml"

permissions:
  contents: read

jobs:
  fetch-orkhevi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe exact list and detail payloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from urllib.request import Request, urlopen

          out = Path("artifacts/telasi_api")
          out.mkdir(parents=True, exist_ok=True)

          def post(url, payload):
              body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              req = Request(url, data=body, method="POST", headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json; charset=utf-8",
                  "User-Agent": "telasi-orkhevi-settlement-outage-analysis/1.0",
              })
              with urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return response.status, json.loads(raw.decode("utf-8")), raw

          list_url = "https://app.telasi.ge/api/view/telasi/getPoweroutages"
          payloads = {
              "user_exact": {"searchText":"","pageNumber":1,"perPage":12,"selectedlan":"ka","taxonomy":{"content_poweroutage":[2769,2770]}},
              "taxonomy_search": {"searchText":"ორხევ","pageNumber":1,"perPage":100,"selectedlan":"ka","taxonomy":{"content_poweroutage":[2769,2770]}},
              "contenttype_taxonomy_search": {"contentType":"poweroutage","searchText":"ორხევ","pageNumber":1,"perPage":100,"selectedlan":"ka","taxonomy":{"content_poweroutage":[2769,2770]}},
              "contenttype_all": {"contentType":"poweroutage","searchText":"","pageNumber":1,"perPage":100,"selectedlan":"ka","taxonomy":{"content_poweroutage":[2769,2770]}},
          }
          summary = {}
          for name, payload in payloads.items():
              status, data, raw = post(list_url, payload)
              (out / f"list-{name}.json").write_bytes(raw)
              api = data.get("api", {}) if isinstance(data, dict) else {}
              items = api.get("list", []) if isinstance(api, dict) else []
              summary[name] = {"status":status,"listCount":api.get("listCount"),"items":len(items) if isinstance(items,list) else None}
              print("PROBE", name, json.dumps(summary[name], ensure_ascii=False))

          dstatus, ddata, draw = post("https://www.telasi.ge/api/getMtData", {"url":"/company-news/power-outage?content=5584","lang":"ka"})
          (out / "detail-content-5584.json").write_bytes(draw)
          summary["getMtData_5584"] = {"status":dstatus,"top_keys":list(ddata.keys()) if isinstance(ddata,dict) else None,"response_bytes":len(draw)}
          (out / "probe-summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Trace live page network requests in Chrome
        run: |
          set -euxo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          echo "chrome=$CHROME"
          test -n "$CHROME"
          mkdir -p artifacts/telasi_api
          timeout 35s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --log-net-log="$PWD/artifacts/telasi_api/chrome-netlog.json" \
            --net-log-capture-mode=Everything \
            --virtual-time-budget=12000 \
            --dump-dom \
            "https://www.telasi.ge/company-news/power-outage?content=5584" \
            > artifacts/telasi_api/page-5584.html || true

          python - <<'PY'
          from pathlib import Path
          import json, re
          p = Path("artifacts/telasi_api/chrome-netlog.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          strings = []
          for event in data.get("events", []):
              params = event.get("params", {})
              text = json.dumps(params, ensure_ascii=False)
              if any(x in text for x in ["telasi.ge/api", "app.telasi.ge/api", "getPoweroutages", "getMtData", "poweroutage", "5584"]):
                  strings.append(json.dumps(event, ensure_ascii=False))
          out = Path("artifacts/telasi_api/network-api-events.txt")
          out.write_text("\n".join(strings), encoding="utf-8")
          print("matching_netlog_events", len(strings))
          for line in strings[:300]:
              print(line[:10000])

          dom = Path("artifacts/telasi_api/page-5584.html").read_text(encoding="utf-8", errors="replace")
          print("DOM_LEN", len(dom))
          for needle in ["5584", "outage", "ენერგომომარაგების", "ავარია", "გაცნობებთ"]:
              print("DOM_NEEDLE", needle, dom.find(needle))
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: telasi-api-browser-trace
          path: artifacts/telasi_api/
          if-no-files-found: error
