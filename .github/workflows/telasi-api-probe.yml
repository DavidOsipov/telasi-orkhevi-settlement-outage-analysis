name: Telasi API probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_telasi_api.py"
      - "data/telasi_api/**"
      - ".github/workflows/telasi-api-probe.yml"

permissions:
  contents: read

jobs:
  fetch-orkhevi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Orkhevi search results
        run: |
          python scripts/fetch_telasi_api.py \
            --search-text "ორხევ" \
            --per-page 100 \
            --output-dir artifacts/telasi_api/orkhevi

      - name: Fetch complete available publication corpus
        run: |
          python scripts/fetch_telasi_api.py \
            --search-text "" \
            --per-page 2000 \
            --output-dir artifacts/telasi_api/all

      - name: Compare official publications with supplied SMS ETA anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, json
          from datetime import datetime

          root = Path("artifacts/telasi_api")
          with (root/"all"/"records.csv").open(encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          with (root/"orkhevi"/"records.csv").open(encoding="utf-8") as f:
              ork = list(csv.DictReader(f))

          dated = [r for r in rows if r["publication_date"]]
          print("ALL_ROWS", len(rows))
          if dated:
              print("DATE_RANGE", min(r["publication_date"] for r in dated), max(r["publication_date"] for r in dated))
          print("ORKHEVI_ROWS", len(ork))
          print("ORKHEVI_CLASSES", {c: sum(r["publication_class"] == c for r in ork) for c in sorted({r["publication_class"] for r in ork})})

          sms_etas = [
              "2024-12-13 16:14", "2024-12-31 11:02",
              "2025-01-17 19:22", "2025-01-19 23:22", "2025-02-07 18:27",
              "2025-04-22 19:13", "2025-06-28 01:18", "2025-06-28 17:43",
              "2025-07-08 15:44", "2025-07-28 00:16", "2025-11-05 14:22",
              "2025-12-06 17:11", "2026-01-12 18:43", "2026-01-13 16:50",
              "2026-01-22 12:00", "2026-01-22 20:00", "2026-03-14 00:22",
              "2026-04-07 19:33", "2026-04-07 22:29", "2026-05-13 13:39",
              "2026-07-14 15:19", "2026-08-04 14:32", "2026-08-05 12:54",
              "2026-08-06 17:40",
          ]
          exact = {}
          for eta in sms_etas:
              matches = [r for r in rows if r["restoration_eta"] == eta]
              exact[eta] = [
                  {k: r[k] for k in ["id","publication_date","publication_class","title","restoration_eta","slug"]}
                  for r in matches
              ]
              print("SMS_ETA", eta, "MATCHES", len(matches))
              for m in exact[eta]:
                  print(" ", json.dumps(m, ensure_ascii=False))

          # Also report official Orkhevi results in compact form.
          compact = []
          seen = set()
          for r in ork:
              key = (r["publication_date"], r["title"], r["restoration_eta"], r["editor_text"])
              duplicate = key in seen
              seen.add(key)
              item = {
                  "id": r["id"],
                  "publication_date": r["publication_date"],
                  "class": r["publication_class"],
                  "title": r["title"],
                  "restoration_eta": r["restoration_eta"],
                  "announced_windows": r["announced_windows"],
                  "exact_duplicate_by_content": duplicate,
              }
              compact.append(item)
              print("ORKHEVI", json.dumps(item, ensure_ascii=False))

          (root/"sms-eta-matches.json").write_text(json.dumps(exact, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          (root/"orkhevi-summary.json").write_text(json.dumps(compact, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PY

      - name: Upload API corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: telasi-api-corpus
          path: artifacts/telasi_api/
          if-no-files-found: error
