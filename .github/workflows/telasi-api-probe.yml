name: Telasi API probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_telasi_api.py"
      - "data/telasi_api/**"
      - ".github/workflows/telasi-api-probe.yml"

permissions:
  contents: read

jobs:
  fetch-orkhevi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Telasi Orkhevi API records
        run: |
          python scripts/fetch_telasi_api.py \
            --search-text "ორხევ" \
            --output-dir artifacts/telasi_api

      - name: Show normalized records
        run: |
          cat artifacts/telasi_api/fetch_metadata.json
          cat artifacts/telasi_api/records.csv

      - name: Probe exact list and detail payloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from urllib.request import Request, urlopen

          out = Path("artifacts/telasi_api")
          out.mkdir(parents=True, exist_ok=True)

          def post(url, payload):
              body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              req = Request(url, data=body, method="POST", headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json; charset=utf-8",
                  "User-Agent": "telasi-orkhevi-settlement-outage-analysis/1.0",
              })
              with urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return response.status, json.loads(raw.decode("utf-8")), raw

          list_url = "https://app.telasi.ge/api/view/telasi/getPoweroutages"
          list_payload = {
              "searchText": "",
              "pageNumber": 1,
              "perPage": 12,
              "selectedlan": "ka",
              "taxonomy": {"content_poweroutage": [2769, 2770]},
          }
          status, data, raw = post(list_url, list_payload)
          (out / "list-exact-page1.json").write_bytes(raw)
          print("LIST_STATUS", status)
          print("LIST_TOP_KEYS", list(data.keys()) if isinstance(data, dict) else type(data).__name__)
          api = data.get("api", {}) if isinstance(data, dict) else {}
          print("LIST_COUNT", api.get("listCount"))
          items = api.get("list", []) if isinstance(api, dict) else []
          print("LIST_ITEMS", len(items) if isinstance(items, list) else type(items).__name__)
          if isinstance(items, list):
              for i, item in enumerate(items[:12], 1):
                  if isinstance(item, dict):
                      print("ITEM", i, json.dumps({k: item.get(k) for k in ["id","code","full_title","title","teaser","editor","outage_time","poweron_time","users_count","created_at","updated_at","slug","url"]}, ensure_ascii=False))
                      blob = json.dumps(item, ensure_ascii=False)
                      if "ორხევ" in blob:
                          print("ORKHEVI_MATCH_PAGE1", i, blob)

          detail_url = "https://www.telasi.ge/api/getMtData"
          detail_payload = {"url": "/company-news/power-outage?content=5584", "lang": "ka"}
          dstatus, ddata, draw = post(detail_url, detail_payload)
          (out / "detail-content-5584.json").write_bytes(draw)
          print("DETAIL_STATUS", dstatus)
          print("DETAIL_TOP_KEYS", list(ddata.keys()) if isinstance(ddata, dict) else type(ddata).__name__)
          print("DETAIL_PREVIEW", json.dumps(ddata, ensure_ascii=False)[:12000])
          PY

      - name: Inspect exact outage API code in Telasi frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          page_url = "https://www.telasi.ge/company-news/power-outage"
          html = urlopen(Request(page_url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read().decode("utf-8", "replace")
          scripts = [urljoin(page_url, src) for src in re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)', html, re.I)]
          needles = [
              "getPoweroutages",
              "telasi/getPoweroutages",
              'contentType:\"poweroutage\"',
              "poweroutage_address",
              "content_poweroutage",
              "getMtData",
          ]
          lines = [f"page={page_url}", f"scripts={len(scripts)}"]
          for url in scripts:
              text = urlopen(Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read().decode("utf-8", "replace")
              for needle in needles:
                  positions = [m.start() for m in re.finditer(re.escape(needle), text)]
                  lines.append(f"{url}\t{needle}\thits={len(positions)}")
                  for pos in positions[:10]:
                      lo = max(0, pos - 1800)
                      hi = min(len(text), pos + 3500)
                      lines.append(f"\n--- {needle!r} @ {pos} ---\n{text[lo:hi]}\n")
          out = Path("artifacts/telasi_api/frontend-outage-api.txt")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(lines), encoding="utf-8")
          print(out.read_text(encoding="utf-8")[:50000])
          PY

      - name: Upload API response artifact
        uses: actions/upload-artifact@v4
        with:
          name: telasi-orkhevi-api-response
          path: artifacts/telasi_api/
          if-no-files-found: error
