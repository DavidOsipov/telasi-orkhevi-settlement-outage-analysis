name: Telasi API probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_telasi_api.py"
      - "data/telasi_api/**"
      - ".github/workflows/telasi-api-probe.yml"

permissions:
  contents: read

jobs:
  fetch-orkhevi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe Telasi with browser-equivalent origin and language
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from urllib.request import Request, urlopen

          out = Path("artifacts/telasi_api")
          out.mkdir(parents=True, exist_ok=True)
          url = "https://app.telasi.ge/api/view/telasi/getPoweroutages"

          def post(name, payload):
              body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              req = Request(url, data=body, method="POST", headers={
                  "Accept": "application/json, text/plain, */*",
                  "Content-Type": "application/json",
                  "lang": "ka",
                  "Origin": "https://www.telasi.ge",
                  "Referer": "https://www.telasi.ge/",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36",
                  "Accept-Language": "en-US,en;q=0.9",
              })
              with urlopen(req, timeout=30) as r:
                  raw = r.read()
                  data = json.loads(raw.decode("utf-8"))
              (out/f"{name}.json").write_bytes(raw)
              api = data.get("api", {})
              items = api.get("list", []) if isinstance(api, dict) else []
              print(name, "status", r.status, "listCount", api.get("listCount"), "items", len(items) if isinstance(items,list) else None)
              if isinstance(items,list):
                  for item in items[:20]:
                      print(json.dumps(item, ensure_ascii=False)[:10000])

          post("search-orkhev", {"contentType":"poweroutage","searchText":"ორხევ"})
          post("list-page1", {"searchText":"","pageNumber":1,"perPage":12,"selectedlan":"ka","taxonomy":{"content_poweroutage":[2769,2770]}})
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: telasi-api-origin-probe
          path: artifacts/telasi_api/
          if-no-files-found: error
