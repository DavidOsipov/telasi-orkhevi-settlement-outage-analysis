name: Telasi API probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fetch_telasi_api.py"
      - "data/telasi_api/**"
      - ".github/workflows/telasi-api-probe.yml"

permissions:
  contents: read

jobs:
  fetch-orkhevi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Telasi Orkhevi API records
        run: |
          python scripts/fetch_telasi_api.py \
            --search-text "ორხევ" \
            --output-dir artifacts/telasi_api

      - name: Show normalized records
        run: |
          cat artifacts/telasi_api/fetch_metadata.json
          cat artifacts/telasi_api/records.csv

      - name: Inspect Telasi frontend API references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          page_url = "https://www.telasi.ge/company-news/power-outage"
          req = Request(page_url, headers={"User-Agent": "Mozilla/5.0"})
          html = urlopen(req, timeout=30).read().decode("utf-8", "replace")
          script_urls = [urljoin(page_url, src) for src in re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)', html, re.I)]
          lines = [f"page={page_url}", f"scripts={len(script_urls)}"]
          needles = ["getPoweroutages", "searchText", "/api/view/telasi/", "poweroutage"]
          for url in script_urls:
              try:
                  text = urlopen(Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read().decode("utf-8", "replace")
              except Exception as exc:
                  lines.append(f"ERROR {url}: {exc}")
                  continue
              hits = []
              for needle in needles:
                  start = 0
                  while True:
                      pos = text.find(needle, start)
                      if pos < 0:
                          break
                      lo = max(0, pos - 800)
                      hi = min(len(text), pos + 1600)
                      hits.append((needle, pos, text[lo:hi]))
                      start = pos + len(needle)
              if hits:
                  lines.append(f"\n### {url}")
                  for needle, pos, context in hits[:20]:
                      lines.append(f"\n--- hit {needle!r} at {pos} ---\n{context}\n")
          out = Path("artifacts/telasi_api/frontend-api-references.txt")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(lines), encoding="utf-8")
          print(out.read_text(encoding="utf-8")[:30000])
          PY

      - name: Upload API response artifact
        uses: actions/upload-artifact@v4
        with:
          name: telasi-orkhevi-api-response
          path: artifacts/telasi_api/
          if-no-files-found: error
